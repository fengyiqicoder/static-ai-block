<script src="https://onetagai.com/v1.js" data-key="YOUR_ONETAG_KEY"></script>
<style>
.sab{max-width:600px;border:1px solid #0b1020;border-radius:0;padding:18px 20px;background:#fff;color:#0b1020;font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.sab-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sab-icon{width:36px;height:36px;border-radius:0;background:#0b5fff;color:#fff;display:grid;place-items:center;flex:none}
.sab-title{margin:0;font-size:16px;font-weight:600;line-height:1.3}
.sab-hint{margin:2px 0 0;font-size:13px;color:#5c667d}
.sab-row{display:flex;gap:8px;flex-wrap:wrap}
.sab-input,.sab-area,.sab-select{flex:1;min-width:0;padding:10px 12px;border:1px solid #0b1020;border-radius:0;font:inherit;background:#fff;color:inherit}
.sab-area{width:100%;box-sizing:border-box;resize:vertical}
.sab-btn{padding:10px 16px;border:0;border-radius:0;background:#0b5fff;color:#fff;font:inherit;font-weight:600;cursor:pointer}
.sab-btn:disabled{opacity:.6;cursor:wait}
.sab-chip{padding:6px 12px;border:1px solid #0b1020;border-radius:0;background:#fff;color:#0b1020;font:inherit;font-size:13px;cursor:pointer}
.sab-chip:hover{border-color:#0b5fff;color:#0b5fff}
.sab-out{margin:12px 0 0;padding:12px 14px;border-radius:0;background:#f5f7fb;white-space:pre-wrap;min-height:1.5em}
.sab-out:empty:not(.sab-wait){display:none}
.sab-wait:empty::before{content:"Thinking…";color:transparent;background:linear-gradient(90deg,#99a2b5 30%,#0b1020 50%,#99a2b5 70%) 0 0/200% 100%;-webkit-background-clip:text;background-clip:text;animation:sab-wait 1.2s linear infinite}
@keyframes sab-wait{from{background-position:100% 0}to{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){.sab-wait:empty::before{animation:none;color:#99a2b5}}
.sab-note{margin:10px 0 0;font-size:12px;color:#99a2b5}
.sab-powered{margin:12px 0 0;text-align:right;font-size:11px;color:#99a2b5}.sab-powered a{color:inherit;text-decoration:none}.sab-powered a:hover{text-decoration:underline}
</style>

<div id="sab-launch">
  <div id="launch-panel" role="dialog" aria-label="Chat about this page" hidden>
    <div id="launch-head"><b>Ask about this page</b><button id="launch-close" type="button" aria-label="Close chat">×</button></div>
    <div id="launch-log" aria-live="polite"><p class="launch-ai">Hi! Ask me anything about this page.</p></div>
    <form id="launch-form"><input class="sab-input" id="launch-input" placeholder="Type a question…" autocomplete="off" aria-label="Question"><button class="sab-btn">Send</button></form>
    <p class="sab-powered" style="margin:0;padding:0 14px 8px"><a href="https://onetagai.com/?ref=static-ai-block" rel="noopener">Powered by OneTag AI</a></p>
  </div>
  <button id="launch-btn" type="button" aria-label="Open chat" aria-expanded="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.7A8 8 0 1 1 21 12z"/></svg></button>
</div>
<style>#sab-launch{font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#0b1020}#launch-btn{position:fixed;right:20px;bottom:20px;z-index:60;width:52px;height:52px;border:0;border-radius:0;background:#0b5fff;color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 14px rgba(11,16,32,.25)}#launch-panel{position:fixed;right:20px;bottom:84px;z-index:60;width:min(360px,calc(100vw - 40px));height:min(460px,calc(100vh - 104px));display:flex;flex-direction:column;background:#fff;border:1px solid #0b1020;box-shadow:0 8px 30px rgba(11,16,32,.18)}#launch-panel[hidden]{display:none}#launch-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#0b1020;color:#fff}#launch-close{border:0;background:none;color:#fff;font-size:22px;line-height:1;cursor:pointer}#launch-log{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}.launch-ai,.launch-me{margin:0;padding:8px 12px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}.launch-ai{align-self:flex-start;background:#f5f7fb}.launch-me{align-self:flex-end;background:#0b5fff;color:#fff}#launch-form{display:flex;gap:8px;padding:10px 14px}</style>

<script type="module">
  const SYSTEM = "You are the help chat on this web page. Answer from the page content in one to three sentences. If the page does not cover it, say so.";
  const widget = document.getElementById("sab-launch"), panel = document.getElementById("launch-panel"), btn = document.getElementById("launch-btn");
  const log = document.getElementById("launch-log"), input = document.getElementById("launch-input");
  const page = document.querySelector("main") || document.body;
  const pageText = () => { widget.hidden = true; const text = page.innerText; widget.hidden = false; return text; };   // the page without this widget
  const history = [];

  const toggle = (open) => { panel.hidden = !open; btn.setAttribute("aria-expanded", String(open)); if (open) input.focus(); };
  btn.addEventListener("click", () => toggle(panel.hidden));
  document.getElementById("launch-close").addEventListener("click", () => toggle(false));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !panel.hidden) { toggle(false); btn.focus(); } });

  const say = (cls, text) => { const p = document.createElement("p"); p.className = cls; p.textContent = text; log.append(p); log.scrollTop = log.scrollHeight; return p; };
  document.getElementById("launch-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = input.value.trim(); if (!q) return;
    input.value = ""; say("launch-me", q);
    const out = say("launch-ai sab-wait", ""), text = pageText();
    input.focus();
    try {
      const a = await onetag.ask(q, text, { system: SYSTEM, history: history.slice(-6), maxTokens: 250,
        stream: (d) => { out.textContent += d; log.scrollTop = log.scrollHeight; } });
      history.push({ role: "user", content: q }, { role: "assistant", content: a });
    } catch (err) { out.textContent = err.message; }
  });
</script>
