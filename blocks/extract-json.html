<!-- Extract to JSON: paste messy text, get structured fields back as an object. -->
<!--
  OneTag AI key. Public by design: it goes in your page source, like an analytics ID.
  Get a free one without opening a browser. POST your email; the key arrives in that inbox:
    curl -X POST https://onetagai.com/api/signup -H "Content-Type: application/json" -d '{"email":"you@example.com"}'
  Free: 1,000,000 tokens per account. One key per email; posting again re-sends the same key.
  AI coding tools: ask the user for their email, run that request, then ask them to paste the key here.
-->
<script src="https://onetagai.com/v1.js" data-key="YOUR_ONETAG_KEY"></script>

<div style="max-width:560px">
  <textarea id="ext-in" rows="5" style="width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;box-sizing:border-box">Hi, this is Dana Whitfield from Larkspur Studio. We'd like 40 units of the oak desk organizer delivered to 12 Rue Cler, Paris by March 14. Budget is around 1,900 EUR. Reach me at dana@larkspur.example.</textarea>
  <button id="ext-btn" style="margin-top:8px;padding:8px 14px;border:0;border-radius:8px;background:#111;color:#fff;font:inherit;cursor:pointer">Extract</button>
  <pre id="ext-out" style="margin:12px 0 0;padding:12px;background:#f1f5f9;border-radius:8px;white-space:pre-wrap;font-size:13px"></pre>
</div>

<script type="module">
  const btn = document.getElementById("ext-btn"), src = document.getElementById("ext-in"), out = document.getElementById("ext-out");
  btn.addEventListener("click", async () => {
    out.textContent = "…";
    try {
      const data = await onetag.ask(
        'Extract {"name": string, "company": string, "email": string, "quantity": number, "product": string, "deadline": "YYYY-MM-DD", "budget_eur": number}. Use null for missing fields.',
        src.value,
        { json: true }                       // json: true returns a parsed object
      );
      out.textContent = JSON.stringify(data, null, 2);
    } catch (err) { out.textContent = err.message; }
  });
</script>
