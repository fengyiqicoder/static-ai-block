<style>
.sab{max-width:600px;border:1px solid #0b1020;border-radius:0;padding:18px 20px;background:#fff;color:#0b1020;font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.sab-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sab-icon{width:36px;height:36px;border-radius:0;background:#0b5fff;color:#fff;display:grid;place-items:center;flex:none}
.sab-title{margin:0;font-size:16px;font-weight:600;line-height:1.3}
.sab-hint{margin:2px 0 0;font-size:13px;color:#5c667d}
.sab-row{display:flex;gap:8px;flex-wrap:wrap}
.sab-input,.sab-area,.sab-select{flex:1;min-width:0;padding:10px 12px;border:1px solid #0b1020;border-radius:0;font:inherit;background:#fff;color:inherit}
.sab-area{width:100%;box-sizing:border-box;resize:vertical}
.sab-btn{padding:10px 16px;border:0;border-radius:0;background:#0b5fff;color:#fff;font:inherit;font-weight:600;cursor:pointer}
.sab-btn:disabled{opacity:.6;cursor:wait}
.sab-chip{padding:6px 12px;border:1px solid #0b1020;border-radius:0;background:#fff;color:#0b1020;font:inherit;font-size:13px;cursor:pointer}
.sab-chip:hover{border-color:#0b5fff;color:#0b5fff}
.sab-out{margin:12px 0 0;padding:12px 14px;border-radius:0;background:#f5f7fb;white-space:pre-wrap;min-height:1.5em}
.sab-out:empty:not(.sab-wait){display:none}
.sab-wait:empty::before{content:"Thinking…";color:transparent;background:linear-gradient(90deg,#99a2b5 30%,#0b1020 50%,#99a2b5 70%) 0 0/200% 100%;-webkit-background-clip:text;background-clip:text;animation:sab-wait 1.2s linear infinite}
@keyframes sab-wait{from{background-position:100% 0}to{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){.sab-wait:empty::before{animation:none;color:#99a2b5}}
.sab-note{margin:10px 0 0;font-size:12px;color:#99a2b5}
.sab-powered{margin:12px 0 0;text-align:right;font-size:11px;color:#99a2b5}.sab-powered a{color:inherit;text-decoration:none}.sab-powered a:hover{text-decoration:underline}
</style>

<section class="sab" id="sab-read">
  <div class="sab-head"><span class="sab-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></span>
    <div><h3 class="sab-title">Read aloud</h3><p class="sab-hint">Listen to the page, or to a short AI summary of it.</p></div></div>
  <div class="sab-row" style="align-items:center">
    <button class="sab-btn" id="ra-play" type="button">Listen</button>
    <button class="sab-chip" id="ra-stop" type="button" hidden>Stop</button>
    <button class="sab-chip" id="ra-sum" type="button">Listen to a summary</button>
    <select class="sab-select" id="ra-rate" style="flex:0 0 auto" aria-label="Speed"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select>
  </div>
  <p class="sab-out" id="ra-now"></p>
  <p class="sab-note" id="ra-note">Reading aloud uses your browser's own voice and costs no tokens. The summary uses AI.</p>
<p class="sab-powered"><a href="https://onetagai.com/?ref=static-ai-block" rel="noopener">Powered by OneTag AI</a></p>
</section>
<style>.ra-on{outline:2px solid #0b5fff;outline-offset:3px}</style>

<script type="module">
  const play = document.getElementById("ra-play"), stop = document.getElementById("ra-stop"), sum = document.getElementById("ra-sum");
  const rate = document.getElementById("ra-rate"), now = document.getElementById("ra-now"), note = document.getElementById("ra-note");
  const root = document.querySelector("article") || document.querySelector("main") || document.body;
  const voice = window.speechSynthesis;
  let run = 0, state = "idle", marked = null;            // run changes on every start and stop, so old callbacks do nothing

  function mark(el) {                                    // outline the part being read
    if (marked) marked.classList.remove("ra-on");
    marked = el;
    if (el) { el.classList.add("ra-on"); if (el.getBoundingClientRect().right > 0) el.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
  }
  function end() { run++; voice.cancel(); state = "idle"; mark(null); now.textContent = ""; now.classList.remove("sab-wait"); play.textContent = "Listen"; stop.hidden = true; }
  function speak(parts) {                                // parts: [{ text, el }]. One utterance per part: browsers cut off long ones.
    end();
    const id = run; let i = 0;
    state = "playing"; play.textContent = "Pause"; stop.hidden = false;
    const next = () => {
      if (id !== run) return;
      if (i >= parts.length) return end();
      const { text, el } = parts[i++], u = new SpeechSynthesisUtterance(text);
      u.rate = +rate.value; if (document.documentElement.lang) u.lang = document.documentElement.lang;
      u.onend = u.onerror = next;
      now.textContent = text; mark(el); voice.speak(u);
    };
    next();
  }

  if (!voice) { play.disabled = sum.disabled = true; note.textContent = "This browser cannot read text aloud."; }
  play.addEventListener("click", () => {
    if (state === "playing") { voice.pause(); state = "paused"; play.textContent = "Resume"; }
    else if (state === "paused") { voice.resume(); state = "playing"; play.textContent = "Pause"; }
    else speak([...root.querySelectorAll("h1,h2,h3,h4,p,li,blockquote")].filter((el) => el.innerText.trim() && !el.querySelector("p,li") && !el.closest("#sab-read")).map((el) => ({ text: el.innerText.trim(), el })));
  });
  stop.addEventListener("click", end);
  sum.addEventListener("click", async () => {
    end(); now.classList.add("sab-wait"); sum.disabled = true;
    try {
      const text = await onetag.ask("Summarize this page in three short sentences, written to be read aloud. No lists, no markdown.", root, { maxTokens: 120 });
      speak((text.match(/[^.!?。！？]+[.!?。！？]*\s*/g) || [text]).map((s) => ({ text: s.trim(), el: null })));
    } catch (err) { now.classList.remove("sab-wait"); now.textContent = err.message; }
    sum.disabled = false;
  });
  addEventListener("pagehide", () => voice && voice.cancel());
</script>
