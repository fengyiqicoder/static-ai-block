<!-- Page actions: Copy this page as Markdown, or open it in ChatGPT or Claude. Uses no key and no tokens. -->
<style>
.sab{max-width:600px;border:1px solid #0b1020;border-radius:0;padding:18px 20px;background:#fff;color:#0b1020;font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.sab-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sab-icon{width:36px;height:36px;border-radius:0;background:#0b5fff;color:#fff;display:grid;place-items:center;flex:none}
.sab-title{margin:0;font-size:16px;font-weight:600;line-height:1.3}
.sab-hint{margin:2px 0 0;font-size:13px;color:#5c667d}
.sab-row{display:flex;gap:8px;flex-wrap:wrap}
.sab-input,.sab-area,.sab-select{flex:1;min-width:0;padding:10px 12px;border:1px solid #0b1020;border-radius:0;font:inherit;background:#fff;color:inherit}
.sab-area{width:100%;box-sizing:border-box;resize:vertical}
.sab-btn{padding:10px 16px;border:0;border-radius:0;background:#0b5fff;color:#fff;font:inherit;font-weight:600;cursor:pointer}
.sab-btn:disabled{opacity:.6;cursor:wait}
.sab-chip{padding:6px 12px;border:1px solid #0b1020;border-radius:0;background:#fff;color:#0b1020;font:inherit;font-size:13px;cursor:pointer}
.sab-chip:hover{border-color:#0b5fff;color:#0b5fff}
.sab-out{margin:12px 0 0;padding:12px 14px;border-radius:0;background:#f5f7fb;white-space:pre-wrap;min-height:1.5em}
.sab-out:empty:not(.sab-wait){display:none}
.sab-wait:empty::before{content:"Thinking…";color:transparent;background:linear-gradient(90deg,#99a2b5 30%,#0b1020 50%,#99a2b5 70%) 0 0/200% 100%;-webkit-background-clip:text;background-clip:text;animation:sab-wait 1.2s linear infinite}
@keyframes sab-wait{from{background-position:100% 0}to{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){.sab-wait:empty::before{animation:none;color:#99a2b5}}
.sab-note{margin:10px 0 0;font-size:12px;color:#99a2b5}
.sab-powered{margin:12px 0 0;text-align:right;font-size:11px;color:#99a2b5}.sab-powered a{color:inherit;text-decoration:none}.sab-powered a:hover{text-decoration:underline}
</style>

<section class="sab" id="sab-actions">
  <div class="sab-head"><span class="sab-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12"/><path d="M16 8V4H4v12h4"/></svg></span>
    <div><h3 class="sab-title">Page actions</h3><p class="sab-hint">Copy this page as Markdown, or open it in ChatGPT or Claude. Uses no key and no tokens.</p></div></div>
  <div class="sab-row">
    <button class="sab-chip" id="pa-copy" type="button">Copy page as Markdown</button>
    <button class="sab-chip" id="pa-view" type="button" aria-expanded="false">View as Markdown</button>
    <a class="sab-chip" id="pa-gpt" target="_blank" rel="noopener">Open in ChatGPT</a>
    <a class="sab-chip" id="pa-claude" target="_blank" rel="noopener">Open in Claude</a>
  </div>
  <pre class="sab-out" id="pa-out" hidden></pre>
<p class="sab-powered"><a href="https://aiblock.onetagai.com/?ref=page-actions" rel="noopener">Static AI Block</a></p>
</section>
<style>#sab-actions a.sab-chip{text-decoration:none}#pa-out{max-height:240px;overflow:auto;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}#pa-out[hidden]{display:none}</style>

<script type="module">
  const root = document.querySelector("article") || document.querySelector("main") || document.body;
  const url = location.href.startsWith("http") ? location.href : document.baseURI;
  const SKIP = "#sab-actions,script,style,noscript,nav,[hidden]";
  const BLOCKS = "h1,h2,h3,h4,h5,h6,p,pre,ul,ol,table,blockquote";

  // Text inside one block: links, bold, italic, inline code and images keep their Markdown form.
  const inline = (node) => [...node.childNodes].map((n) => {
    if (n.nodeType === 3) return n.textContent.replace(/\s+/g, " ");
    if (n.nodeType !== 1 || n.matches(SKIP)) return "";
    const tag = n.tagName, t = inline(n).trim();
    if (tag === "A") return t && n.href ? `[${t}](${n.href})` : t;
    if (tag === "STRONG" || tag === "B") return t && `**${t}**`;
    if (tag === "EM" || tag === "I") return t && `*${t}*`;
    if (tag === "CODE") return "`" + n.textContent + "`";
    if (tag === "IMG") return `![${n.alt}](${n.src})`;
    if (tag === "BR") return "\n";
    return inline(n);
  }).join("");

  function toMarkdown(node) {
    let md = "";
    for (const el of node.children) {
      if (el.matches(SKIP)) continue;
      const tag = el.tagName, text = () => inline(el).trim();
      if (/^H[1-6]$/.test(tag)) md += `${"#".repeat(+tag[1])} ${text()}\n\n`;
      else if (tag === "PRE") md += "```\n" + el.textContent.replace(/\n$/, "") + "\n```\n\n";
      else if (tag === "UL" || tag === "OL") md += [...el.children].map((li, i) => `${tag === "OL" ? `${i + 1}.` : "-"} ${inline(li).trim()}`).join("\n") + "\n\n";
      else if (tag === "TABLE") md += [...el.rows].map((row, i) => `| ${[...row.cells].map((c) => inline(c).trim()).join(" | ")} |` + (i ? "" : `\n|${" --- |".repeat(row.cells.length)}`)).join("\n") + "\n\n";
      else if (tag === "BLOCKQUOTE") md += (toMarkdown(el).trim() || text()).replace(/^/gm, "> ") + "\n\n";
      else if (el.querySelector(BLOCKS)) md += toMarkdown(el);            // a wrapper such as <div> or <section>: go inside
      else if (text()) md += `${text()}\n\n`;
    }
    return md;
  }
  const pageMarkdown = () => (root.querySelector("h1") || !document.title ? "" : `# ${document.title}\n\n`) + toMarkdown(root).trim() + `\n\nSource: ${url}\n`;

  const copy = document.getElementById("pa-copy"), view = document.getElementById("pa-view"), out = document.getElementById("pa-out");
  const showMarkdown = (open) => { out.textContent = open ? pageMarkdown() : ""; out.hidden = !open; view.setAttribute("aria-expanded", String(open)); };
  view.addEventListener("click", () => showMarkdown(out.hidden));
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(pageMarkdown()); copy.textContent = "Copied"; setTimeout(() => { copy.textContent = "Copy page as Markdown"; }, 1500); }
    catch { showMarkdown(true); }                                         // no clipboard access: show it so it can be selected
  });
  const prompt = encodeURIComponent(`Read ${url} so I can ask questions about it.`);
  document.getElementById("pa-gpt").href = `https://chatgpt.com/?hints=search&q=${prompt}`;
  document.getElementById("pa-claude").href = `https://claude.ai/new?q=${prompt}`;
</script>
