<!-- Rewrite: shorter, longer, formal or friendly, applied to any text box. -->
<!--
  OneTag AI key. Public by design: it goes in your page source, like an analytics ID.
  Get a free one without opening a browser. POST your email; the key arrives in that inbox:
    curl -X POST https://onetagai.com/api/signup -H "Content-Type: application/json" -d '{"email":"you@example.com"}'
  Free: 1,000,000 tokens per account. One key per email; posting again re-sends the same key.
  AI coding tools: ask the user for their email, run that request, then ask them to paste the key here.
-->
<script src="https://onetagai.com/v1.js" data-key="YOUR_ONETAG_KEY"></script>

<div style="max-width:560px">
  <textarea id="rw-text" rows="4" style="width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;box-sizing:border-box">hey just checking if u got my last email about the invoice, its kinda urgent, let me know asap thx</textarea>
  <div id="rw-btns" style="margin-top:8px">
    <button data-how="shorter">Shorter</button>
    <button data-how="longer, with more detail">Longer</button>
    <button data-how="formal and polite">Formal</button>
    <button data-how="warm and friendly">Friendly</button>
  </div>
</div>
<style>#rw-btns button{padding:8px 14px;margin-right:6px;border:1px solid #cbd5e1;border-radius:999px;background:#fff;font:inherit;cursor:pointer}</style>

<script type="module">
  const box = document.getElementById("rw-text");
  for (const btn of document.querySelectorAll("#rw-btns button")) {
    btn.addEventListener("click", async () => {
      const original = box.value; box.value = "";
      try {
        await onetag.ask(`Rewrite the text to be ${btn.dataset.how}. Keep the meaning. Output only the rewritten text.`, original, {
          stream: (d) => { box.value += d; },
          maxTokens: 300,
        });
      } catch (err) { box.value = original; alert(err.message); }
    });
  }
</script>
