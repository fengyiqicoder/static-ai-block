<style>

.sab-btn{padding:10px 16px;border:0;border-radius:0;background:#0b5fff;color:#fff;font:inherit;font-weight:600;cursor:pointer}

.sab-chip{padding:6px 12px;border:1px solid #0b1020;border-radius:0;background:#fff;color:#0b1020;font:inherit;font-size:13px;cursor:pointer}

.sab-wait:empty::before{content:"Thinking…";color:transparent;background:linear-gradient(90deg,#99a2b5 30%,#0b1020 50%,#99a2b5 70%) 0 0/200% 100%;-webkit-background-clip:text;background-clip:text;animation:sab-wait 1.2s linear infinite}

<section class="sab" id="sab-voice">
  <div class="sab-head"><span class="sab-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
    <div><h3 class="sab-title">Voice input</h3><p class="sab-hint">Dictate with the microphone, then let AI tidy the transcript.</p></div></div>
  <textarea class="sab-area" id="vo-text" rows="4" aria-label="Transcript">so um i wanted to follow up on the meeting yesterday i think we agreed to ship the new pricing page by friday and uh the copy should be ready tomorrow right</textarea>
  <div class="sab-row" style="margin-top:10px">
    <button class="sab-chip" id="vo-mic" type="button" aria-pressed="false">● Dictate</button>
    <button class="sab-btn" id="vo-tidy" type="button">Tidy up</button>
    <button class="sab-chip" id="vo-copy" type="button">Copy</button>
  </div>
  <p class="sab-note" id="vo-note" aria-live="polite">Dictation runs in your browser and costs no tokens. Tidy up uses AI.</p>
<p class="sab-powered"><a href="https://onetagai.com/?ref=static-ai-block" rel="noopener">Powered by OneTag AI</a></p>
</section>
<style>#vo-mic[aria-pressed=true]{border-color:#b91c1c;color:#b91c1c}#vo-mic:disabled{opacity:.5;cursor:not-allowed}</style>

<script type="module">
  const box = document.getElementById("vo-text"), mic = document.getElementById("vo-mic"), tidy = document.getElementById("vo-tidy"), note = document.getElementById("vo-note");

  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;   // built into Chrome, Edge and Safari
  if (!Speech) { mic.disabled = true; note.textContent = "This browser has no speech recognition. Type or paste, then tidy up."; }
  else {
    const rec = new Speech(); let on = false, before = "";
    rec.continuous = true; rec.interimResults = true; rec.lang = document.documentElement.lang || navigator.language;
    rec.onresult = (e) => { box.value = before + [...e.results].map((r) => r[0].transcript).join(""); };
    rec.onerror = (e) => { note.textContent = e.error === "not-allowed" ? "Microphone access was blocked." : `Dictation stopped: ${e.error}.`; };
    rec.onend = () => { on = false; mic.setAttribute("aria-pressed", "false"); mic.textContent = "● Dictate"; };
    mic.addEventListener("click", () => {
      if (on) return rec.stop();
      before = box.value.trim() ? box.value.trimEnd() + " " : "";
      on = true; mic.setAttribute("aria-pressed", "true"); mic.textContent = "■ Stop"; rec.start();
    });
  }

  tidy.addEventListener("click", async () => {
    const raw = box.value;
    if (!raw.trim()) return;
    box.value = ""; box.placeholder = "Tidying…"; tidy.disabled = true;
    try {
      await onetag.ask("Clean up this dictated text: add punctuation and capitalization, fix obvious mis-hearings, remove filler words. Keep the speaker's wording and language. Output only the cleaned text.",
        raw, { maxTokens: 400, stream: (d) => { box.value += d; } });
    } catch (err) { box.value = raw; note.textContent = err.message; }
    box.placeholder = ""; tidy.disabled = false;
  });
  document.getElementById("vo-copy").addEventListener("click", async (e) => { await navigator.clipboard.writeText(box.value); e.target.textContent = "Copied"; setTimeout(() => { e.target.textContent = "Copy"; }, 1500); });
</script>
