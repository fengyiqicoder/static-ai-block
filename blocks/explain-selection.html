<style>#explain-pop{position:absolute;z-index:50;max-width:320px;padding:10px 12px;border-radius:0;background:#0b5fff;color:#fff;font:14px/1.5 system-ui,sans-serif}#explain-acts{display:flex;gap:6px}#explain-acts button{border:0;border-radius:0;padding:4px 10px;background:#fff;color:#0b1020;font:inherit;font-weight:600;cursor:pointer}#explain-out{margin:8px 0 0;white-space:pre-wrap}#explain-out:empty:not(.sab-wait){display:none}#explain-out.sab-wait:empty::before{background-image:linear-gradient(90deg,#b9d0ff 30%,#fff 50%,#b9d0ff 70%)}</style>

<script type="module">
  const pop = document.getElementById("explain-pop"), out = document.getElementById("explain-out");
  const myLanguage = new Intl.DisplayNames(["en"], { type: "language" }).of(navigator.language.split("-")[0]);   // Translate goes to the reader's own language
  let selected = "";
  function onSelect() {
    const sel = window.getSelection(), text = sel && sel.toString().trim();
    if (!text || text.length < 4 || pop.contains(sel.anchorNode)) return;
    const r = sel.getRangeAt(0).getBoundingClientRect();
    selected = text; out.textContent = ""; out.classList.remove("sab-wait");
    pop.style.left = `${Math.max(8, r.left + window.scrollX)}px`; pop.style.top = `${r.bottom + window.scrollY + 8}px`;
    pop.hidden = false;
  }
  document.addEventListener("mouseup", onSelect);
  document.addEventListener("touchend", () => setTimeout(onSelect, 50));
  document.addEventListener("mousedown", (e) => { if (!pop.contains(e.target)) pop.hidden = true; });
  for (const btn of document.querySelectorAll("#explain-acts button")) {
    btn.addEventListener("click", async () => {
      const task = btn.dataset.do === "translate" ? `Translate this into ${myLanguage}. Output only the translation.` : btn.dataset.do;
      out.textContent = ""; out.classList.add("sab-wait");
      try {
        await onetag.ask(task, selected, { stream: (d) => { out.textContent += d; }, maxTokens: 150 });
      } catch (err) { out.textContent = err.message; }
    });
  }
</script>
