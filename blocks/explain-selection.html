<style>
.sab{max-width:600px;border:1px solid #e5e7eb;border-radius:14px;padding:18px 20px;background:#fff;color:#111827;font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.sab-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sab-icon{width:36px;height:36px;border-radius:10px;background:#111827;color:#fff;display:grid;place-items:center;flex:none}
.sab-title{margin:0;font-size:16px;font-weight:650;line-height:1.3}
.sab-hint{margin:2px 0 0;font-size:13px;color:#6b7280}
.sab-row{display:flex;gap:8px;flex-wrap:wrap}
.sab-input,.sab-area,.sab-select{flex:1;min-width:0;padding:10px 12px;border:1px solid #d1d5db;border-radius:9px;font:inherit;background:#fff;color:inherit}
.sab-area{width:100%;box-sizing:border-box;resize:vertical}
.sab-btn{padding:10px 16px;border:0;border-radius:9px;background:#111827;color:#fff;font:inherit;font-weight:600;cursor:pointer}
.sab-btn:disabled{opacity:.6;cursor:wait}
.sab-chip{padding:6px 12px;border:1px solid #d1d5db;border-radius:999px;background:#fff;color:#374151;font:inherit;font-size:13px;cursor:pointer}
.sab-chip:hover{border-color:#111827;color:#111827}
.sab-out{margin:12px 0 0;padding:12px 14px;border-radius:9px;background:#f3f4f6;white-space:pre-wrap;min-height:1.5em}
.sab-out:empty{display:none}
.sab-note{margin:10px 0 0;font-size:12px;color:#9ca3af}
</style>

<section class="sab" id="sab-explain">
  <div class="sab-head"><span class="sab-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg></span>
    <div><h3 class="sab-title">Explain any selection</h3><p class="sab-hint">Select any text on the page to get it explained.</p></div></div>
  <p style="margin:0;padding:12px 14px;border:1px dashed #d1d5db;border-radius:9px;color:#374151">Try it here: a <b>sourdough starter</b> is a live culture of wild yeast and lactobacilli; <b>autolyse</b> rests flour and water before salt; a <b>cold proof</b> develops flavour overnight in the fridge.</p>
</section>

<div id="explain-pop" hidden style="position:absolute;z-index:50;max-width:320px;padding:10px 12px;border-radius:10px;background:#111827;color:#fff;font:14px/1.5 system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25)">
  <button id="explain-btn" style="border:0;border-radius:6px;padding:4px 10px;background:#fff;color:#111827;font:inherit;font-weight:600;cursor:pointer">✦ Explain</button>
  <p id="explain-out" style="margin:8px 0 0;white-space:pre-wrap"></p>
</div>

<script type="module">
  const pop = document.getElementById("explain-pop"), btn = document.getElementById("explain-btn"), out = document.getElementById("explain-out");
  let selected = "";
  document.addEventListener("mouseup", () => {
    const sel = window.getSelection(), text = sel && sel.toString().trim();
    if (!text || text.length < 4 || pop.contains(sel.anchorNode)) return;
    const r = sel.getRangeAt(0).getBoundingClientRect();
    selected = text; out.textContent = "";
    pop.style.left = `${r.left + window.scrollX}px`; pop.style.top = `${r.bottom + window.scrollY + 8}px`;
    pop.hidden = false;
  });
  document.addEventListener("mousedown", (e) => { if (!pop.contains(e.target)) pop.hidden = true; });
  btn.addEventListener("click", async () => {
    out.textContent = "…";
    try {
      await onetag.ask("Explain this to a beginner in two sentences.", selected, {
        stream: (d) => { if (out.textContent === "…") out.textContent = ""; out.textContent += d; }, maxTokens: 120,
      });
    } catch (err) { out.textContent = err.message; }
  });
</script>
