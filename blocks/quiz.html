<script type="module">
  const btn = document.getElementById("quiz-btn"), out = document.getElementById("quiz-out");
  btn.addEventListener("click", async () => {
    out.innerHTML = "<li>…</li>"; btn.disabled = true;
    try {
      const data = await onetag.ask(
        'Write 3 multiple-choice questions about the content as JSON: {"questions": [{"q": string, "options": [4 strings], "answer": 0-3}]}',
        document.querySelector("main") || document.body, { json: true, maxTokens: 600 });
      out.innerHTML = "";
      data.questions.forEach((item, n) => {
        const li = document.createElement("li");
        li.innerHTML = `<b>${item.q}</b><br>` + item.options.map((o, i) => `<label style="display:block"><input type="radio" name="q${n}" value="${i}"> ${o}</label>`).join("");
        li.addEventListener("change", (e) => { li.style.color = Number(e.target.value) === item.answer ? "#15803d" : "#b91c1c"; });
        out.append(li);
      });
    } catch (err) { out.innerHTML = `<li>${err.message}</li>`; }
    btn.disabled = false;
  });
</script>
